<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>My Music Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#111;color:#fff}
header{padding:30px;text-align:center;background:linear-gradient(135deg,#d6004c,#7b1fa2)}
.container{max-width:1000px;margin:auto;padding:40px 20px}
.tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.tab{flex:1;padding:15px;background:#1e1e1e;border:none;color:#fff;border-radius:12px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#d6004c,#7b1fa2)}
.section{display:none}
.section.active{display:block}
.upload-box{background:#1e1e1e;padding:25px;border-radius:12px;margin-bottom:40px}
input{width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:none}
input[type=file]{background:#fff;color:#000}
button{background:#d6004c;color:#fff;border:none;padding:12px 24px;border-radius:25px;cursor:pointer}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.video-card{background:#1e1e1e;border-radius:12px;overflow:hidden}
video{width:100%;height:200px;object-fit:cover}
.video-info{padding:15px}
.video-actions{display:flex;gap:8px;padding:0 15px 15px}
.download-btn,.edit-btn,.delete-btn{flex:1;padding:8px;border:none;border-radius:8px;cursor:pointer;color:#fff}
.download-btn{background:#d6004c;text-decoration:none;text-align:center}
.edit-btn{background:#7b1fa2}
.delete-btn{background:#444}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.modal-content{background:#1e1e1e;padding:25px;border-radius:12px;width:90%;max-width:400px}
</style>
</head>

<body>

<header>
<h1>🎶 My Music Studio</h1>
<p>Gestion locale vidéo (IndexedDB)</p>
</header>

<div class="container">

<!-- CREAZIONE -->
<div class="upload-box">
<input id="title" placeholder="Titolo">
<input id="artist" placeholder="Artista">
<label>Cover</label>
<input type="file" id="coverFile" accept="image/*">
<label>Audio</label>
<input type="file" id="audioFile" accept="audio/*">
<button onclick="createVideo()">Crea Video</button>
</div>

<h2>🎞️ Video</h2>
<div id="videoGrid" class="video-grid"></div>

</div>

<!-- MODAL -->
<div class="modal" id="editModal">
<div class="modal-content">
<h3>✏️ Modifica Video</h3>
<input id="editTitle" placeholder="Titolo">
<input id="editArtist" placeholder="Artista">
<label>Nuova cover</label>
<input type="file" id="editCover" accept="image/*">
<button onclick="saveEdit()">Salva</button>
<button onclick="closeEdit()" style="background:#444;margin-top:10px">Annulla</button>
</div>
</div>

<script>
let db,currentEditId=null

/* DB */
function openDB(){
return new Promise(res=>{
const r=indexedDB.open("VideoDB",10)
r.onupgradeneeded=e=>{
const d=e.target.result
if(!d.objectStoreNames.contains("videos"))
d.createObjectStore("videos",{keyPath:"id"})
}
r.onsuccess=e=>{db=e.target.result;res()}
})
}
const store=(n,m)=>db.transaction(n,m).objectStore(n)

/* CREA VIDEO */
async function createVideo(){
if(!title.value||!artist.value||!coverFile.files[0]||!audioFile.files[0])
return alert("Compila tutto")

const canvas=document.createElement("canvas")
canvas.width=1280;canvas.height=720
const ctx=canvas.getContext("2d")
const img=new Image()
img.src=URL.createObjectURL(coverFile.files[0])
await img.decode()
ctx.drawImage(img,0,0,canvas.width,canvas.height)

const stream=canvas.captureStream(30)
const audio=new Audio(URL.createObjectURL(audioFile.files[0]))
const ac=new AudioContext()
const src=ac.createMediaElementSource(audio)
const dest=ac.createMediaStreamDestination()
src.connect(dest);src.connect(ac.destination)
stream.addTrack(dest.stream.getAudioTracks()[0])

const rec=new MediaRecorder(stream,{mimeType:"video/webm"})
let chunks=[]
rec.ondataavailable=e=>chunks.push(e.data)
rec.onstop=async()=>{
store("videos","readwrite").put({
id:crypto.randomUUID(),
blob:new Blob(chunks,{type:"video/webm"}),
title:title.value,
artist:artist.value,
cover:await coverFile.files[0].arrayBuffer(),
coverType:coverFile.files[0].type,
coverUpdated:Date.now(),
date:Date.now()
})
loadGallery()
}
rec.start()
audio.play()
audio.onended=()=>rec.stop()
}

/* GALLERY */
function loadGallery(){
videoGrid.innerHTML=""
store("videos","readonly").getAll().onsuccess=e=>{
e.target.result.forEach(v=>{
const videoURL=URL.createObjectURL(v.blob)
const poster=v.cover
?URL.createObjectURL(new Blob([v.cover],{type:v.coverType}))+"?t="+v.coverUpdated
:""

const card=document.createElement("div")
card.className="video-card"
card.innerHTML=`
<video preload="none"
       data-key="${v.coverUpdated}"
       src="${videoURL}"
       ${poster?`poster="${poster}"`:""}
       controls></video>

<div class="video-info">
<b>${v.title}</b><br>${v.artist}
</div>

<div class="video-actions">
<a class="download-btn" href="${videoURL}" download="${v.title}.webm">⬇️</a>
<button class="edit-btn">✏️</button>
<button class="delete-btn">🗑️</button>
</div>
`
card.querySelector(".edit-btn").onclick=()=>openEdit(v)
card.querySelector(".delete-btn").onclick=()=>{
store("videos","readwrite").delete(v.id)
loadGallery()
}
videoGrid.appendChild(card)
})
}
}

/* EDIT */
function openEdit(v){
currentEditId=v.id
editTitle.value=v.title
editArtist.value=v.artist
editCover.value=""
editModal.style.display="flex"
}
function closeEdit(){editModal.style.display="none"}

async function saveEdit(){
store("videos","readonly").get(currentEditId).onsuccess=async e=>{
const v=e.target.result
v.title=editTitle.value
v.artist=editArtist.value
if(editCover.files[0]){
v.cover=await editCover.files[0].arrayBuffer()
v.coverType=editCover.files[0].type
v.coverUpdated=Date.now()
}
store("videos","readwrite").put(v)
closeEdit()
loadGallery()
}
}

openDB().then(loadGallery)
</script>

</body>
</html>
