<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>My Music Studio – Cover Video</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#111;color:#fff}
header{padding:30px;text-align:center;background:linear-gradient(135deg,#d6004c,#7b1fa2)}
.container{max-width:1000px;margin:auto;padding:40px 20px}
.tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.tab{flex:1;min-width:150px;padding:15px;background:#1e1e1e;border:none;color:#fff;cursor:pointer;border-radius:12px}
.tab.active{background:linear-gradient(135deg,#d6004c,#7b1fa2)}
.section{display:none}
.section.active{display:block}
.upload-box{background:#1e1e1e;padding:25px;border-radius:12px;margin-bottom:40px}
input{width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:none}
input[type=file]{background:#fff;color:#000}
label{display:block;margin-top:10px;margin-bottom:5px;color:#aaa}
button{background:#d6004c;color:#fff;border:none;padding:12px 24px;border-radius:25px;cursor:pointer}
button:disabled{background:#555}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.video-card{background:#1e1e1e;border-radius:12px;overflow:hidden}
.video-card video{width:100%;height:200px;object-fit:cover}
.video-info{padding:15px}
.video-actions{display:flex;gap:10px;padding:0 15px 15px}
.download-btn,.edit-btn,.delete-btn{
flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;text-align:center
}
.download-btn{background:#d6004c;color:#fff;text-decoration:none}
.edit-btn{background:#7b1fa2;color:#fff}
.delete-btn{background:#444;color:#fff}

.modal{
position:fixed;inset:0;background:rgba(0,0,0,.7);
display:none;align-items:center;justify-content:center
}
.modal-content{
background:#1e1e1e;padding:25px;border-radius:12px;width:90%;max-width:400px
}
.modal-content h3{text-align:center}
</style>
</head>

<body>

<header>
<h1>🎶 My Music Studio</h1>
<p>Gestione video locale con IndexedDB</p>
</header>

<div class="container">

<!-- GALLERIA -->
<div id="gallery">
<h2>🎞️ Video</h2>
<div id="videoGrid" class="video-grid"></div>
</div>

</div>

<!-- MODAL MODIFICA -->
<div class="modal" id="editModal">
<div class="modal-content">
<h3>✏️ Modifica Video</h3>
<input id="editTitle" placeholder="Titolo">
<input id="editArtist" placeholder="Artista">
<label>Nuova Cover (opzionale)</label>
<input type="file" id="editCover" accept="image/*">
<button onclick="saveEdit()">💾 Salva</button>
<button style="background:#444;margin-top:10px" onclick="closeEdit()">Annulla</button>
</div>
</div>

<script>
let dbInstance=null
let currentEditId=null

/* -------- DB -------- */
function openDB(){
return new Promise((res,rej)=>{
const r=indexedDB.open("VideoDB",5)
r.onupgradeneeded=e=>{
const db=e.target.result
if(!db.objectStoreNames.contains("videos")){
db.createObjectStore("videos",{keyPath:"id"})
}
}
r.onsuccess=e=>{dbInstance=e.target.result;res(dbInstance)}
r.onerror=e=>rej(e.target.error)
})
}

async function getVideos(){
const db=await openDB()
return new Promise(res=>{
const tx=db.transaction("videos","readonly")
tx.objectStore("videos").getAll().onsuccess=e=>res(e.target.result||[])
})
}

async function saveVideo(data){
const db=await openDB()
return new Promise(res=>{
const tx=db.transaction("videos","readwrite")
tx.objectStore("videos").put(data)
tx.oncomplete=res
})
}

async function deleteVideo(id){
if(!confirm("Eliminare?"))return
const db=await openDB()
const tx=db.transaction("videos","readwrite")
tx.objectStore("videos").delete(id)
tx.oncomplete=loadGallery
}

/* -------- EDIT -------- */
function openEdit(video){
currentEditId=video.id
editTitle.value=video.title||""
editArtist.value=video.artist||""
editCover.value=""
editModal.style.display="flex"
}

function closeEdit(){
editModal.style.display="none"
currentEditId=null
}

async function saveEdit(){
const title=editTitle.value.trim()
const artist=editArtist.value.trim()
const coverFile=editCover.files[0]

const vids=await getVideos()
const video=vids.find(v=>v.id===currentEditId)
if(!video)return

video.title=title
video.artist=artist

if(coverFile){
video.cover=await coverFile.arrayBuffer()
video.coverType=coverFile.type
}

await saveVideo(video)
closeEdit()
loadGallery()
}

/* -------- GALLERY -------- */
async function loadGallery(){
const vids=await getVideos()
videoGrid.innerHTML=""

vids.sort((a,b)=>b.date-a.date).forEach(v=>{
const videoURL=URL.createObjectURL(v.blob)
let poster=""

if(v.cover){
poster=URL.createObjectURL(new Blob([v.cover],{type:v.coverType}))
}

const card=document.createElement("div")
card.className="video-card"
card.innerHTML=`
<video src="${videoURL}" ${poster?`poster="${poster}"`:""} controls></video>
<div class="video-info">
<b>${v.title||"Video"}</b><br>${v.artist||""}
</div>
<div class="video-actions">
<button class="edit-btn">✏️ Modifica</button>
<a class="download-btn" href="${videoURL}" download="${v.title||"video"}.webm">⬇️</a>
<button class="delete-btn">🗑️</button>
</div>`
card.querySelector(".edit-btn").onclick=()=>openEdit(v)
card.querySelector(".delete-btn").onclick=()=>deleteVideo(v.id)
videoGrid.appendChild(card)
})
}

window.onload=()=>openDB().then(loadGallery)
</script>

</body>
</html>
