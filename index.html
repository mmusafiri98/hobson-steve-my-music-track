<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>My Music Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#111;color:#fff}
header{padding:30px;text-align:center;background:linear-gradient(135deg,#d6004c,#7b1fa2)}
.container{max-width:1000px;margin:auto;padding:40px 20px}
.tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.tab{flex:1;padding:15px;background:#1e1e1e;border:none;color:#fff;border-radius:12px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#d6004c,#7b1fa2)}
.section{display:none}
.section.active{display:block}
.upload-box{background:#1e1e1e;padding:25px;border-radius:12px;margin-bottom:40px}
input{width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:none}
input[type=file]{background:#fff;color:#000}
button{background:#d6004c;color:#fff;border:none;padding:12px 24px;border-radius:25px;cursor:pointer}
button:disabled{background:#555}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.video-card{background:#1e1e1e;border-radius:12px;overflow:hidden}
video{width:100%;height:200px;object-fit:cover}
.video-info{padding:15px}
.video-actions{display:flex;gap:8px;padding:0 15px 15px}
.download-btn,.delete-btn{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;color:#fff;text-align:center}
.download-btn{background:#d6004c;text-decoration:none}
.delete-btn{background:#444}
.empty{text-align:center;color:#777;padding:60px}
</style>
</head>

<body>

<header>
<h1>🎶 My Music Studio</h1>
<p>Gestione locale video / audio / PDF (IndexedDB)</p>
</header>

<div class="container">

<div class="tabs">
<button class="tab active" onclick="switchTab('create')">🎬 Crea Video</button>
<button class="tab" onclick="switchTab('import')">📤 Importa Video</button>
<button class="tab" onclick="switchTab('mp3')">🎵 MP3</button>
<button class="tab" onclick="switchTab('pdf')">📄 PDF</button>
</div>

<!-- CREA VIDEO -->
<div id="createSection" class="section active">
<div class="upload-box">
<input id="title" placeholder="Titolo">
<input id="artist" placeholder="Artista">
<label>Cover</label>
<input type="file" id="coverFile" accept="image/*">
<label>Audio</label>
<input type="file" id="audioFile" accept="audio/*">
<button onclick="createVideo()">Crea Video</button>
</div>
</div>

<!-- IMPORT VIDEO -->
<div id="importSection" class="section">
<div class="upload-box">
<input id="importTitle" placeholder="Titolo">
<input id="importArtist" placeholder="Artista">
<input type="file" id="importFile" accept="video/*">
<button onclick="importVideo()">Importa</button>
</div>
</div>

<!-- MP3 -->
<div id="mp3Section" class="section">
<div class="upload-box">
<input id="mp3Title" placeholder="Titolo">
<input id="mp3Artist" placeholder="Artista">
<input type="file" id="mp3File" accept="audio/*">
<button onclick="importMP3()">Importa MP3</button>
</div>
</div>

<!-- PDF -->
<div id="pdfSection" class="section">
<div class="upload-box">
<input id="pdfTitle" placeholder="Titolo PDF">
<input type="file" id="pdfFile" accept="application/pdf">
<button onclick="importPDF()">Importa PDF</button>
</div>
</div>

<h2>🎞️ Video</h2>
<div id="videoGrid" class="video-grid"></div>

<h2>🎵 MP3</h2>
<div id="mp3Grid" class="video-grid"></div>

<h2>📄 PDF</h2>
<div id="pdfGrid" class="video-grid"></div>

<div id="empty" class="empty">Nessun contenuto</div>

</div>

<script>
/* ================= DB STABILE ================= */
const DB_NAME = "VideoDB"
const DB_VERSION = 10
let db = null

function openDB(){
return new Promise(res=>{
const r = indexedDB.open(DB_NAME, DB_VERSION)
r.onupgradeneeded = e=>{
const d = e.target.result
if(!d.objectStoreNames.contains("videos"))
d.createObjectStore("videos",{keyPath:"id"})
if(!d.objectStoreNames.contains("mp3s"))
d.createObjectStore("mp3s",{keyPath:"id"})
if(!d.objectStoreNames.contains("pdfs"))
d.createObjectStore("pdfs",{keyPath:"id"})
}
r.onsuccess = e=>{db=e.target.result;res()}
})
}

const store=(n,m)=>db.transaction(n,m).objectStore(n)

/* ================= UI ================= */
function switchTab(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'))
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'))
document.getElementById(id+'Section').classList.add('active')
event.target.classList.add('active')
}

/* ================= CREA VIDEO (OTTIMIZZATO) ================= */
async function createVideo(){
if(!title.value||!artist.value||!coverFile.files[0]||!audioFile.files[0])
return alert("Completa tutti i campi")

const canvas=document.createElement("canvas")
canvas.width=960
canvas.height=540
const ctx=canvas.getContext("2d")

const img=new Image()
img.src=URL.createObjectURL(coverFile.files[0])
await img.decode()

const audio=new Audio(URL.createObjectURL(audioFile.files[0]))

const stream=canvas.captureStream(10)
const ac=new AudioContext()
const src=ac.createMediaElementSource(audio)
const dest=ac.createMediaStreamDestination()
src.connect(dest)
src.connect(ac.destination)
stream.addTrack(dest.stream.getAudioTracks()[0])

const rec=new MediaRecorder(stream,{mimeType:"video/webm"})
let chunks=[]

rec.ondataavailable=e=>chunks.push(e.data)
rec.onstop=()=>{
store("videos","readwrite").put({
id:Date.now().toString(),
blob:new Blob(chunks,{type:"video/webm"}),
title:title.value,
artist:artist.value,
date:Date.now()
})
loadGallery()
}

function draw(){
ctx.fillStyle="#000"
ctx.fillRect(0,0,canvas.width,canvas.height)
ctx.drawImage(img,0,0,canvas.width,canvas.height)
ctx.fillStyle="#fff"
ctx.font="36px Arial"
ctx.textAlign="center"
ctx.fillText(title.value,canvas.width/2,500)
ctx.font="24px Arial"
ctx.fillText(artist.value,canvas.width/2,530)
}

const loop=setInterval(draw,100)
rec.start()
audio.play()
audio.onended=()=>{
clearInterval(loop)
rec.stop()
}
}

/* ================= IMPORT ================= */
function importVideo(){
const f=importFile.files[0]
if(!f)return
store("videos","readwrite").put({
id:Date.now().toString(),
blob:f,
title:importTitle.value||"Video",
artist:importArtist.value||"",
date:Date.now()
})
loadGallery()
}

function importMP3(){
const f=mp3File.files[0]
if(!f)return
store("mp3s","readwrite").put({
id:Date.now().toString(),
blob:f,
title:mp3Title.value||f.name,
artist:mp3Artist.value||"",
date:Date.now()
})
loadGallery()
}

function importPDF(){
const f=pdfFile.files[0]
if(!f)return
store("pdfs","readwrite").put({
id:Date.now().toString(),
blob:f,
title:pdfTitle.value||f.name,
date:Date.now()
})
loadGallery()
}

/* ================= GALLERY (COMPATIBILE CON DATI VECCHI) ================= */
function loadGallery(){
videoGrid.innerHTML=mp3Grid.innerHTML=pdfGrid.innerHTML=""
let empty=true

store("videos","readonly").getAll().onsuccess=e=>{
e.target.result.forEach(v=>{
empty=false
const url=URL.createObjectURL(v.blob)
videoGrid.innerHTML+=`
<div class="video-card">
<video src="${url}" controls></video>
<div class="video-info"><b>${v.title||"Video"}</b><br>${v.artist||""}</div>
<div class="video-actions">
<a class="download-btn" href="${url}" download="${(v.title||'video')}.webm">⬇️</a>
<button class="delete-btn" onclick="store('videos','readwrite').delete('${v.id}');loadGallery()">🗑️</button>
</div></div>`
})
}

store("mp3s","readonly").getAll().onsuccess=e=>{
e.target.result.forEach(m=>{
empty=false
const url=URL.createObjectURL(m.blob)
mp3Grid.innerHTML+=`
<div class="video-card">
<div class="video-info"><b>${m.title}</b><br>${m.artist}</div>
<div class="video-actions">
<a class="download-btn" href="${url}" download="${m.title}.mp3">⬇️</a>
<button class="delete-btn" onclick="store('mp3s','readwrite').delete('${m.id}');loadGallery()">🗑️</button>
</div></div>`
})
}

store("pdfs","readonly").getAll().onsuccess=e=>{
e.target.result.forEach(p=>{
empty=false
const url=URL.createObjectURL(p.blob)
pdfGrid.innerHTML+=`
<div class="video-card">
<div class="video-info"><b>${p.title}</b></div>
<div class="video-actions">
<a class="download-btn" href="${url}" target="_blank">Apri</a>
<button class="delete-btn" onclick="store('pdfs','readwrite').delete('${p.id}');loadGallery()">🗑️</button>
</div></div>`
})
}

document.getElementById("empty").style.display=empty?"block":"none"
}

/* ================= START ================= */
openDB().then(loadGallery)
</script>

</body>
</html>
